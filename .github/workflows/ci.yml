name: CI

on:
  push:
    branches: [dev, testing, main]
  pull_request:
    branches: [dev, testing, main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Use a normal install until the generated lockfile is committed to this branch.
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck core
        run: pnpm typecheck

      - name: Run core tests
        run: pnpm test

      - name: Build core
        run: pnpm build

      - name: Typecheck basic example
        run: pnpm --filter @archeon/example-basic typecheck
